{% extends 'base.html' %}
{% block title %}{{ 'Editar' if projeto else 'Novo' }} Projeto{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{{ url_for('projetos_list') }}" class="btn btn-light me-3"><i class="bi bi-arrow-left"></i></a>
  <h4 class="fw-bold mb-0">{{ 'Editar Projeto' if projeto else 'Novo Projeto' }}</h4>
</div>

<div class="card p-4" style="max-width:680px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Nome do Projeto *</label>
      <input type="text" name="nome" class="form-control"
             value="{{ projeto.nome if projeto else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Descrição</label>
      <textarea name="descricao" class="form-control" rows="3">{{ projeto.descricao if projeto else '' }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Objetivos</label>
      <textarea name="objetivos" class="form-control" rows="3">{{ projeto.objetivos if projeto else '' }}</textarea>
    </div>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label fw-semibold">Data de Início</label>
        <input type="date" name="data_inicio" class="form-control"
               value="{{ projeto.data_inicio if projeto else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Data de Fim</label>
        <input type="date" name="data_fim" class="form-control"
               value="{{ projeto.data_fim if projeto else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Estado</label>
        <select name="estado" class="form-select">
          {% for e in ['Em curso', 'Planeamento', 'Suspenso', 'Concluído', 'Cancelado'] %}
          <option value="{{ e }}" {% if projeto and projeto.estado == e %}selected{% endif %}>{{ e }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary px-4">
        <i class="bi bi-check-lg me-1"></i>{{ 'Guardar' if projeto else 'Criar Projeto' }}
      </button>
      <a href="{{ url_for('projetos_list') }}" class="btn btn-light">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
