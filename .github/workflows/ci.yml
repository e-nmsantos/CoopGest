name: CoopGest CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: Validate app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        run: py -3.13 -m pip install -r requirements.txt pytest

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Audit high vulnerabilities
        run: npm audit --audit-level=high

      - name: Python compileall
        run: py -3.13 -m compileall -q app.py coopgest tests

      - name: Pytest
        run: py -3.13 -m pytest -q

      - name: E2E
        run: npm exec -- playwright test --workers=1 --retries=0

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
